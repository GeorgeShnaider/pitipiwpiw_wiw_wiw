; =============================================================================
;  ТНПА с надводным буем — единое PlatformIO-пространство на три прошивки.
;  Владелец файла: ЛИД (чат 0). Остальные агенты присылают запросы на изменения.
;
;  Сборка всех узлов:   pio run -e rov_core -e buoy -e cam
;  Прошивка узла:       pio run -e <env> -t upload
;  WebApp в LittleFS:   pio run -e buoy -t uploadfs
;  Хост-тесты на ПК:    pio test -e native
; =============================================================================

[platformio]
default_envs = rov_core

; ---------- Общие настройки для всех ESP32 ----------------------------------
; Платформа зафиксирована: Arduino-ESP32 core 2.0.x (API ledcSetup/ledcAttachPin,
; analogReadMilliVolts). Обновление платформы — только через лида.
[esp32_common]
platform = espressif32 @ 6.9.0
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
build_flags =
    -Wall
    -Wextra
    -I include

; ---------- Главный контроллер ТНПА (отсек 4), ESP-WROOM-32 ------------------
[env:rov_core]
extends = esp32_common
board = esp32dev
build_src_filter = +<rov_core/>
build_flags =
    ${esp32_common.build_flags}
    -D NODE_ROV_CORE
    ; Логи ядра (log_e/log_w) выключены: их вывод ждёт опустошения UART0 и делает malloc в loop()
    -D CORE_DEBUG_LEVEL=0
lib_deps =
    bblanchon/ArduinoJson @ ^7.2.0

; ---------- Надводный буй (узел 6), ESP-WROOM-32 ------------------------------
; Раздаёт data/index.html из LittleFS, держит точку доступа и WebSocket.
[env:buoy]
extends = esp32_common
board = esp32dev
build_src_filter = +<buoy/>
board_build.filesystem = littlefs
board_build.partitions = default.csv
build_flags =
    ${esp32_common.build_flags}
    -D NODE_BUOY
lib_deps =
    ESP32Async/AsyncTCP @ ^3.3.2
    ESP32Async/ESPAsyncWebServer @ ^3.6.0
    bblanchon/ArduinoJson @ ^7.2.0

; ---------- Курсовая камера (отсек 5), ESP32-CAM (AI-Thinker, OV2640) --------
[env:cam]
extends = esp32_common
board = esp32cam
build_src_filter = +<cam/>
board_build.partitions = huge_app.csv
build_flags =
    ${esp32_common.build_flags}
    -D NODE_CAM
    -D BOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue

; ---------- Хост-тесты чистой логики на ПК (без Arduino.h) --------------------
; Собираются только модули без зависимостей от Arduino. Тесты: test/test_<узел>/.
; Подключение заголовков из тестов: "rov_core/mixer.h", "buoy/cmd_codec.h" и т.п.
[env:native]
platform = native
test_framework = unity
test_build_src = yes
build_src_filter =
    -<*>
    +<rov_core/mixer.cpp>
    +<rov_core/packet_parser.cpp>
    +<rov_core/link_supervisor.cpp>
    +<rov_core/ms5837_math.cpp>
    +<rov_core/attitude.cpp>
    +<rov_core/vbat_math.cpp>
    +<buoy/cmd_codec.cpp>
    +<buoy/telemetry_line.cpp>
    +<buoy/video_parser.cpp>
build_flags =
    -std=c++17
    -Wall
    -Wextra
    -I include
    -I src
lib_deps =
    bblanchon/ArduinoJson @ ^7.2.0
